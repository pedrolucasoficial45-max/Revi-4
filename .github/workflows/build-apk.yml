name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permissão de microfone
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO\|RecognitionService" android/app/src/main/AndroidManifest.xml

      - name: Gerar ícones do app
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sincronizar arquivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Revi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
